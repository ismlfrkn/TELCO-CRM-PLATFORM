services:
  postgres:
    image: postgres:16
    container_name: telco-postgres
    # Varsayilan max_connections=100, 10 domain servisinin HikariCP havuzlariyla (bkz.
    # configs/application.yaml) birlikte dahi asilmasin diye genis bir marjla 200'e cikarildi.
    command: postgres -c max_connections=200
    # Bellek tavani: WSL2/Docker Desktop varsayilan olarak host RAM'inin sadece %50'sini kullanir
    # (bkz. CLAUDE.md Bolum 15) ve JVM'ler sinirsiz -Xmx ile bu havuzu kolayca tasirip motoru
    # tikayabiliyordu. Her serviste sabit bir mem_limit + (JVM'lerde) -Xmx tavani, toplam
    # kullanimin ongorulebilir kalmasini saglar.
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # This is the default db, but we can create logical DBs later if needed
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - telco-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: telco-pgadmin
    mem_limit: 384m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - telco-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: telco-kafka
    mem_limit: 640m
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - telco-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: telco-redis
    mem_limit: 192m
    ports:
      - "6379:6379"
    networks:
      - telco-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Platform servisleri (Bolum 7 / CLAUDE.md Bolum 15 baslatma sirasiyla ayni):
  # discovery-server -> config-server -> api-gateway -> domain servisleri.
  # ---------------------------------------------------------------------------

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: telco-discovery-server
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports:
      - "8761:8761"
    networks:
      - telco-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8761 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: telco-config-server
    mem_limit: 384m
    volumes:
      # application.yaml'daki native search-location "file:../configs,file:../configs/{application}"
      # WORKDIR /app/config-server'a gore bu mount'u cozer (bkz. config-server/Dockerfile).
      - ./configs:/app/configs:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - telco-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: telco-api-gateway
    mem_limit: 480m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx320m"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5000"
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telco-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity-service:
