  # ---------------------------------------------------------------------------
  # Gozlemlenebilirlik yigini (Zipkin/Prometheus/Grafana/ELK): api-gateway + 10 domain servisinin
  # hepsi artik gercek trace (Micrometer+Brave), metric (/actuator/prometheus) ve JSON log
  # (LogstashTcpSocketAppender) uretiyor (bkz. CLAUDE.md Bolum 16, kok pom.xml, configs/application.yaml,
  # her serviste logback-spring.xml). Yine de "docker compose up" ile varsayilan olarak
  # BASLAMAZLAR (Elasticsearch tek basina en az ~1GB) - ihtiyac oldugunda
  # `docker compose --profile observability up -d` ile acilirlar; kapaliyken servisler span/log
  # gonderimini sessizce arka planda basarisiz sayar, hicbir istegi bloklamaz/cokertmez.
  # ---------------------------------------------------------------------------

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: telco-zipkin
    profiles: ["observability"]
    mem_limit: 384m
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m"
    ports:
      # Bkz. logstash/kibana servislerindeki ayni not: Windows'un Hyper-V icin dinamik olarak
      # ayirdigi port araliklari (netsh interface ipv4 show excludedportrange protocol=tcp) 9411'i
      # de kapsayabiliyor; container ici port (Zipkin'in kendi varsayilani) degismedi, sadece host
      # mapping'i farkli.
      - "19411:9411"
    networks:
      - telco-net

  prometheus:
    image: prom/prometheus:latest
    container_name: telco-prometheus
    profiles: ["observability"]
    mem_limit: 384m
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - telco-net

  grafana:
    image: grafana/grafana:latest
    container_name: telco-grafana
    profiles: ["observability"]
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - telco-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: telco-elasticsearch
    profiles: ["observability"]
    mem_limit: 1152m
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - telco-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: telco-logstash
    profiles: ["observability"]
    mem_limit: 576m
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx320m"
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      # Host 5000/5001, bu makinede Windows'un Hyper-V icin ayirdigi dinamik port araligiyla
      # (netsh interface ipv4 show excludedportrange protocol=tcp -> 4912-5011) catisiyor;
      # container ici port (logstash.conf'taki TCP input) degismedi, sadece host mapping'i farkli.
      - "5900:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - telco-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: telco-kibana
    profiles: ["observability"]
    mem_limit: 640m
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=448"
    ports:
      # Bkz. logstash servisindeki not: Windows'un Hyper-V icin dinamik olarak ayirdigi port
      # araliklari zamanla kayabiliyor (5601 de tekrarlayan sekilde catisti); daha yuksek, bu
      # araliklarin disinda kalan bir host portu kullanildi.
      - "15601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - telco-net

networks:
  telco-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
