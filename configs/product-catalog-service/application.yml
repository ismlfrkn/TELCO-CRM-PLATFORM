server:
  port: 9003

spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/product_catalog_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

# Bölüm 8.2: tariff/addon by-code cache'inin TTL'i (saniye). Cache-aside: yazma yollarinda
# (update/patch/delete/linkAddon) ilgili anahtar aninda evict edilir; TTL sadece kacirilan
# bir evict yolu olursa (ör. manuel DB degisikligi) sonsuza kadar bayat kalmamasi icin.
product-catalog:
  cache:
    ttl-seconds: 600

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
