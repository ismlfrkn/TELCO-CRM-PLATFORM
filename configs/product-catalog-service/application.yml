server:
  port: 9003

spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/product_catalog_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        catalogEvents-out-0:
          destination: telco.catalog.events
          content-type: application/json

product-catalog:
  cache:
    ttl-seconds: 600

outbox:
  publisher:
    poll-interval-ms: 5000
    batch-size: 20

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
