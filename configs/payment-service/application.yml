server:
  port: 9008

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/payment_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: orderEvents;subscriptionEvents;invoiceEvents
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        orderEvents-in-0:
          destination: telco.order.events
          group: payment-service
          content-type: application/json
        subscriptionEvents-in-0:
          destination: telco.subscription.events
          group: payment-service
          content-type: application/json
        invoiceEvents-in-0:
          destination: telco.billing.events
          group: payment-service
          content-type: application/json
        paymentEvents-out-0:
          destination: telco.payment.events
          content-type: application/json

outbox:
  publisher:
    poll-interval-ms: 5000
    batch-size: 20

payment:
  retry:
    cron: "0 0 * * * *"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
