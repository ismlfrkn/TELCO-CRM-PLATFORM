server:
  port: 9005

spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:postgresql://localhost:5433/subscription_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: paymentEvents
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        paymentEvents-in-0:
          destination: telco.payment.events
          group: subscription-service
          content-type: application/json
        subscriptionEvents-out-0:
          destination: telco.subscription.events
          content-type: application/json

outbox:
  publisher:
    poll-interval-ms: 5000
    batch-size: 20

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
