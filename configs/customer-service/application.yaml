server:
  port: 9002

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5433/customer_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# TCKN/VKN alan bazli AES-256-GCM sifreleme anahtari (Base64, 32 byte).
# Deger burada tutulmaz; PII_ENCRYPTION_KEY ortam degiskeninden (K8s Secret'ta) okunur
# (bkz. .env.example, scripts/load-env.ps1).
pii:
  encryption-key: ${PII_ENCRYPTION_KEY}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/