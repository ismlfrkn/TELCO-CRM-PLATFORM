server:
  port: 9001

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5433/identity_db
    username: telco_admin
    password: telco_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# jwt.secret configs/application.yaml (global) icinde tanimlidir; burada sadece bu servise
# ozel token sureleri kalir.
jwt:
  access-token-expiration: 900000 # 15 minutes in ms
  refresh-token-expiration: 86400000 # 1 day in ms
