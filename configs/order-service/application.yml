server:
  port: 9004

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  health:
    circuitbreakers:
      enabled: true

# Saga'nin en kirilgan noktasi olan Feign zincirine (Bolum 9.2) circuit breaker + retry.
# recordExceptions/retryExceptions sadece transient/altyapisal hatalari (5xx, timeout, baglanti hatasi)
# kapsar - FeignException.NotFound gibi normal is sonuclari bu listelere dahil edilmedi, cunku onlar
# downstream servisin sagligiyla degil isteğin kendisiyle ilgili (bkz. OrderService client gateway'leri).
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.RetryableException
          - java.io.IOException
    instances:
      customer-service:
        baseConfig: default
      product-catalog-service:
        baseConfig: default
      payment-service:
        baseConfig: default
      subscription-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.RetryableException
          - java.io.IOException
    instances:
      customer-service:
        baseConfig: default
      product-catalog-service:
        baseConfig: default
      payment-service:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 1s
      # subscription-service icin retry instance'i BILINCLI OLARAK tanimlanmadi:
      # createSubscription'in idempotency key'i yok, retry mukerrer abonelik/MSISDN riski tasir.
