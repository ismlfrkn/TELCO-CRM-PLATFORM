server:
  port: 9004

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: paymentEvents;subscriptionEvents
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        paymentEvents-in-0:
          destination: telco.payment.events
          group: order-service
          content-type: application/json
        subscriptionEvents-in-0:
          destination: telco.subscription.events
          group: order-service
          content-type: application/json
        orderEvents-out-0:
          destination: telco.order.events
          content-type: application/json

outbox:
  publisher:
    poll-interval-ms: 5000
    batch-size: 20

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.RetryableException
          - java.io.IOException
    instances:
      customer-service:
        baseConfig: default
      product-catalog-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.RetryableException
          - java.io.IOException
    instances:
      customer-service:
        baseConfig: default
      product-catalog-service:
        baseConfig: default
