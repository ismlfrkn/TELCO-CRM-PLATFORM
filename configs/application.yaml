management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# api-gateway ile downstream servisler arasinda paylasilan internal secret.
# Downstream servisler X-User-Id/X-User-Roles header'larina yalnizca bu secret dogruysa guvenir
# (bkz. identity-service GatewayHeaderAuthenticationFilter). Tum servislerde ayni deger olmalidir.
# Deger burada tutulmaz; her servis kendi sureç ortamindaki GATEWAY_INTERNAL_SECRET'tan okur
# (bkz. .env.example, scripts/load-env.ps1). Yuklenmemisse servis "Could not resolve
# placeholder" hatasiyla baslamaz - bu kasitlidir, sessizce zayif bir varsayilana dusmemek icin.
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

# identity-service'in access token uretmek, api-gateway'in ise dogrulamak icin kullandigi ayni HMAC
# secret (jjwt, HS256). Global tanimlanir ki iki servis de ayni degeri tek kaynaktan okusun.
# Deger burada tutulmaz; JWT_SECRET ortam degiskeninden okunur (bkz. .env.example).
jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: info
    com.turkcell: debug