# Sablon dosyadir - gercek degerlerle DOGRUDAN commit edilmez (.env.example ile ayni mantik).
# Gercek secret'i olusturmak icin (repo kokunden, .env zaten varsa):
#   kubectl create namespace telco-crm --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic telco-secrets --from-env-file=.env -n telco-crm
#
# .env yoksa once "cp .env.example .env" ile olustur, degerleri doldur, sonra yukaridaki komutu calistir.
# Bu dosyayi kustomization.yaml resources listesine EKLEME - sadece dokumantasyon/sablon amaclidir.
apiVersion: v1
kind: Secret
metadata:
  name: telco-secrets
  namespace: telco-crm
type: Opaque
stringData:
  POSTGRES_USER: telco_admin
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: telco_crm
  GATEWAY_INTERNAL_SECRET: change-me
  JWT_SECRET: change-me
  PII_ENCRYPTION_KEY: change-me
