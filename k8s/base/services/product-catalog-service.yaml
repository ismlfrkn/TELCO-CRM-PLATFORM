apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-service
  namespace: telco-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog-service
  template:
    metadata:
      labels:
        app: product-catalog-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://discovery-server:8761/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do echo "waiting for discovery-server..."; sleep 3; done
              until wget -q -O- http://config-server:8888/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do echo "waiting for config-server..."; sleep 3; done
              until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 3; done
              until nc -z kafka 29092; do echo "waiting for kafka..."; sleep 3; done
              until nc -z redis 6379; do echo "waiting for redis..."; sleep 3; done
      containers:
        - name: product-catalog-service
          image: telco-product-catalog-service:latest
          ports:
            - containerPort: 9003
          envFrom:
            - secretRef: { name: telco-secrets }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms96m -Xmx320m" }
            - { name: SPRING_CONFIG_IMPORT, value: "optional:configserver:http://config-server:8888" }
            - { name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://discovery-server:8761/eureka/" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/product_catalog_db" }
            - { name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS, value: "kafka:29092" }
            - { name: SPRING_DATA_REDIS_HOST, value: "redis" }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "480Mi", cpu: "500m" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 9003 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 9003 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 9003 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog-service
  namespace: telco-crm
spec:
  selector:
    app: product-catalog-service
  ports:
    - port: 9003
      targetPort: 9003
