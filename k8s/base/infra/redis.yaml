apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: telco-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "192Mi", cpu: "250m" }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: telco-crm
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
