# NOT: Hicbir serviste henuz JSON yapilandirilmis log/log shipper (Logback appender, Filebeat vb.)
# yapilandirilmadi (CLAUDE.md Bolum 16). Bu pipeline, servis tarafi eklendiginde kullanilacak
# bos bir TCP girisi tanimlar; su an hicbir veri akmiyor.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "telco-logs-%{+YYYY.MM.dd}"
  }
}
