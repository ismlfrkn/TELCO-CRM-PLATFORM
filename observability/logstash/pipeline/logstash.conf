# Tum servisler artik LogstashTcpSocketAppender ile JSON log basiyor (kok pom.xml + her serviste
# logback-spring.xml, Bolum 16). Bu pipeline sadece `docker compose --profile observability up -d`
# ile acildiginda gercekten veri alir.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "telco-logs-%{+YYYY.MM.dd}"
  }
}
