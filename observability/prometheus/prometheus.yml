global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Tum servisler artik micrometer-registry-prometheus'a sahip (kok pom.xml, Bolum 16) ve
# /actuator/prometheus'u expose ediyor (configs/application.yaml). Bu yigin sadece
# `docker compose --profile observability up -d` ile acildiginda scrape gercekten calisir.
scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'identity-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['identity-service:9001']

  - job_name: 'customer-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['customer-service:9002']

  - job_name: 'product-catalog-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['product-catalog-service:9003']

  - job_name: 'order-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:9004']

  - job_name: 'subscription-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['subscription-service:9005']

  - job_name: 'usage-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['usage-service:9006']

  - job_name: 'billing-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['billing-service:9007']

  - job_name: 'payment-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:9008']

  - job_name: 'notification-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:9009']

  - job_name: 'ticket-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ticket-service:9010']
