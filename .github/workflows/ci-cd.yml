name: CI/CD

on:
  push:
    branches: [main, nurgul]
  pull_request:
    branches: [main, nurgul]

env:
  SERVICES: >-
    discovery-server config-server api-gateway identity-service customer-service
    product-catalog-service order-service subscription-service usage-service
    billing-service payment-service notification-service ticket-service

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all modules
        run: mvn -B clean install

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push each service image
        run: |
          set -e
          for service in $SERVICES; do
            echo "=== $service ==="
            docker buildx build \
              --file "$service/Dockerfile" \
              --tag "${{ secrets.DOCKER_USERNAME }}/telco-$service:latest" \
              --tag "${{ secrets.DOCKER_USERNAME }}/telco-$service:${{ github.sha }}" \
              --push \
              .
          done

  # CLAUDE.md Bolum 10/15 hedef akisi: "Build -> test -> docker push -> kubectl apply".
  # Bu job'un cluster'i (Kind) runner uzerinde efemer olarak kurulup is bitince atilir - kullanicinin
  # kendi Minikube/Kind'ina degil, sadece k8s/ manifestlerinin gercekten deploy edilebilir oldugunu
  # dogrular. Ilk faz: sadece Kafka'ya bagimli olmayan kritik zincir (postgres, redis, discovery-server,
  # config-server, api-gateway, identity-service) - bkz. k8s/overlays/ci-subset/kustomization.yaml
  # yorumlari. Kalan 7 domain servisi + Kafka, bu ilk faz guvenilir calistiktan sonra eklenecek.
  k8s-deploy-check:
    name: K8s Deploy Check (Kind, critical services)
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Point manifests at the images just pushed
        run: |
          sed -i "s#codebynurgul/telco-#${{ secrets.DOCKER_USERNAME }}/telco-#g" k8s/base/kustomization.yaml

      - name: Create ephemeral Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: telco-ci

      - name: Create namespace and CI-only secret
        run: |
          kubectl create namespace telco-crm --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic telco-secrets -n telco-crm \
            --from-literal=POSTGRES_USER=telco_admin \
            --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
            --from-literal=POSTGRES_DB=telco_crm \
            --from-literal=GATEWAY_INTERNAL_SECRET="$(openssl rand -hex 32)" \
            --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
            --from-literal=PII_ENCRYPTION_KEY="$(openssl rand -hex 16)"

      - name: Apply k8s/overlays/ci-subset
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/ci-subset | kubectl apply -f -

      - name: Wait for rollout
        run: |
          set -e
          for d in postgres redis discovery-server config-server identity-service api-gateway; do
            echo "=== rollout status: $d ==="
            kubectl rollout status "deployment/$d" -n telco-crm --timeout=300s
          done

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n telco-crm -o wide
          kubectl describe pods -n telco-crm
          for d in postgres redis discovery-server config-server identity-service api-gateway; do
            echo "=== logs: $d ==="
            kubectl logs -n telco-crm "deployment/$d" --all-containers --tail=100 || true
          done
