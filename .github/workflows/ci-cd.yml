name: CI/CD

on:
  push:
    branches: [main, nurgul]
  pull_request:
    branches: [main, nurgul]

env:
  SERVICES: >-
    discovery-server config-server api-gateway identity-service customer-service
    product-catalog-service order-service subscription-service usage-service
    billing-service payment-service notification-service ticket-service

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all modules
        run: mvn -B clean install

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push each service image
        run: |
          set -e
          for service in $SERVICES; do
            echo "=== $service ==="
            docker buildx build \
              --file "$service/Dockerfile" \
              --tag "${{ secrets.DOCKER_USERNAME }}/telco-$service:latest" \
              --tag "${{ secrets.DOCKER_USERNAME }}/telco-$service:${{ github.sha }}" \
              --push \
              .
          done
